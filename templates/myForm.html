<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .gender {
            width: auto;
        }

        .button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #2878d0;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #145a9c;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Registration Form</h2>

    <form action="/register" method="POST">

        <label for="name">Full Name</label>
        <input type="text"
               id="name"
               name="name"
               placeholder="Enter your full name"
               required>

        <label for="email">Email</label>
        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your email"
               required>

        <label for="phone">Phone Number</label>
        <input type="tel"
               id="phone"
               name="phone"
               placeholder="Enter your phone number"
               pattern="[0-9]{10}"
               required>

        <label>Gender</label>

        <input class="gender"
               type="radio"
               name="gender"
               value="Male"
               required> Male

        <input class="gender"
               type="radio"
               name="gender"
               value="Female"> Female

        <input class="gender"
               type="radio"
               name="gender"
               value="Other"> Other

        <label for="course">Course</label>

        <select id="course" name="course" required>

            <option value="">Select Course</option>
            <option value="B.Tech">B.Tech</option>
            <option value="M.Tech">M.Tech</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>

        </select>

        <input class="button"
               type="submit"
               value="Register">

    </form>

</div>

</body>

</html>
