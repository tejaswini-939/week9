<!DOCTYPE html>
<html>

<head>
    <title>Registration Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
            color: green;
        }

        .details {
            margin-top: 20px;
            line-height: 1.8;
        }

        .label {
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Registration Successful!</h2>

    <div class="details">

        <p>
            <span class="label">Name:</span>
            {{ name }}
        </p>

        <p>
            <span class="label">Email:</span>
            {{ email }}
        </p>

        <p>
            <span class="label">Phone:</span>
            {{ phone }}
        </p>

        <p>
            <span class="label">Gender:</span>
            {{ gender }}
        </p>

        <p>
            <span class="label">Course:</span>
            {{ course }}
        </p>

    </div>

    <a class="back" href="/">
        Register Another User
    </a>

</div>

</body>

</html>
